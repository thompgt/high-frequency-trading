# hft_engine configuration.
#
#   ./build/hft_engine --config config/engine.conf
#
# Format: `key = value`, one per line. `#` starts a comment. An unknown or
# malformed key is a hard error rather than a warning -- a typo in a risk limit
# that silently leaves the default in place is exactly the failure this file
# exists to prevent. Run `--list-settings` for the full key list and
# `--print-config` to see the effective values without running anything.
#
# CLI flags are applied AFTER this file, so `--set max_drawdown=100` wins.

# ----------------------------------------------------------------- market data
symbol       = SYNTH
events       = 2000000
seed         = 1592356062
# replay_path = data/replay.csv   # replay a capture instead of generating

# -------------------------------------------------------------------- strategy
fast_window    = 5
slow_window    = 20
order_quantity = 10

# ------------------------------------------------------------------ order book
# The book is a flat array over this price band, so the band costs memory but
# makes price -> level a single subtraction. Keep it tight around where the
# instrument actually trades. Max span is 262144 ticks.
min_price     = 5000     # $50.00
max_price     = 15000    # $150.00
ring_capacity = 65536

# ----------------------------------------------------------------------- venue
slippage_bps = 1.0    # only used when cross_book = false
fee_bps      = 0.5
cross_book   = true   # fill against real resting depth rather than a flat haircut

# ------------------------------------------------------------------------ risk
# These are the numbers that stop a strategy bug from becoming an incident.
# Every rejection is counted by reason and reported in metrics.json.
risk_enabled            = true

# Fat finger: no single order may exceed these.
max_order_quantity      = 10000
max_order_notional      = 1000000.0

# Inventory. max_position_per_symbol must be <= max_gross_position or the gross
# limit can never bind (the engine refuses to start if so).
max_position_per_symbol = 50000
max_gross_position      = 200000

# Reject orders priced more than this far from the engine's reference price.
# Guards against acting on a corrupt or stale quote.
price_collar_bps        = 500.0

# Rate limits. NOTE: a synthetic run replays hours of order flow in under a
# second, so a production-sane 1000/sec throttle will reject most orders in a
# demo. Raise it when benchmarking; leave it realistic when operating.
max_orders_per_second   = 1000
max_daily_orders        = 1000000

# Peak-to-trough equity loss that trips the kill switch. Sticky: once tripped,
# trading stops until it is explicitly released, even if equity recovers.
max_drawdown            = 25000.0

# ------------------------------------------------------------- order management
# Every order is tracked from send to a terminal state, and the quantity still
# in flight is added to the position before the inventory limits above are
# applied -- otherwise a burst of unanswered orders walks straight past them.

# Ceiling on simultaneously working orders. Hitting it means an order is NOT
# sent: one we cannot track is one we cannot cancel or reconcile. Refusing to
# trade is recoverable; losing track of a live order is not.
max_open_orders = 4096

# How long an order may go unacknowledged before its state is declared unknown
# and its exposure released. Deliberately far above any healthy round trip, so
# tripping it means something is actually wrong.
ack_timeout_ms  = 1000

# How many finished orders stay queryable, for answering "what happened to
# order 812?" and for telling a late report apart from an invented one.
order_history   = 8192

# ----------------------------------------------------------------- engine / ops
threaded        = true    # run the feed on its own thread via the SPSC ring
record_curve    = true    # keep the per-fill equity curve (for fills.csv)
out_dir         = out     # metrics.json + CSVs land here; must already exist
depth_levels    = 15
log_level       = info
flatten_on_exit = true    # close out inventory before exiting
