name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    name: Python research companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  cpp-cmake:
    name: C++ engine (CMake, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S cpp -B cpp/build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build-ci --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir cpp/build-ci --build-config Release --output-on-failure

  cpp-make:
    name: C++ engine (Makefile + -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Makefile is the build used on machines without CMake, so it has to
      # keep working. -Werror is on by default in CXXFLAGS.
      - name: Build with -Wall -Wextra -Wpedantic -Werror
        working-directory: cpp
        run: make -j"$(nproc)"

      - name: Unit tests
        working-directory: cpp
        run: ./build/hft_tests

      - name: Engine smoke test
        working-directory: cpp
        run: |
          mkdir -p out
          ./build/hft_engine --events 200000 --out-dir out \
            --set max_orders_per_second=100000000
          test -s out/metrics.json
          test -s out/latency_summary.csv
          test -s out/fills.csv
          test -s out/book_snapshot.csv

      - name: Config validation must reject bad input
        working-directory: cpp
        run: |
          # A typo'd key and a contradictory setting must both fail loudly.
          ! ./build/hft_engine --set max_postion_per_symbol=10 --events 1000
          ! ./build/hft_engine --set fast_window=50 --set slow_window=10 --events 1000
          ./build/hft_engine --config config/engine.conf --print-config

      - name: Multiple instruments each get their own book
        working-directory: cpp
        run: |
          mkdir -p out
          ./build/hft_engine --events 90000 --out-dir out \
            --set instrument=AAPL:15000:30000 \
            --set instrument=ESZ5:400000:410000:25:1:250 \
            --set instrument=PENNY:100:900 \
            --set max_orders_per_second=100000000 > out/multi.txt
          # Three separate books, each reported separately.
          grep -q "final book: AAPL"  out/multi.txt
          grep -q "final book: ESZ5"  out/multi.txt
          grep -q "final book: PENNY" out/multi.txt
          # The snapshot has to name which book each level belongs to.
          grep -q "^symbol,side,price" out/book_snapshot.csv
          grep -q "^ESZ5,"            out/book_snapshot.csv
          # A tick-grid instrument must still build real depth -- if the feed
          # ignored tick_size the contract check would reject nearly all of it.
          test "$(grep -c '^ESZ5,' out/book_snapshot.csv)" -gt 5

      - name: Journal survives a crash and blocks an unclean restart
        working-directory: cpp
        run: |
          mkdir -p out
          rm -f out/ci.jrn
          ./build/hft_engine --events 60000 --journal out/ci.jrn \
            --set max_orders_per_second=100000000 > /dev/null
          # A clean shutdown must restart without complaint.
          ./build/hft_engine --events 1000 --journal out/ci.jrn \
            --set max_orders_per_second=100000000 > /dev/null

          # Now simulate a crash: truncate mid-record, losing the end marker.
          python3 -c "import os; p='out/ci.jrn'; os.truncate(p, os.path.getsize(p)-232)"

          # Exit code 6 means "the last session left state a human must look
          # at". A supervisor restarting blindly must NOT get away with it.
          set +e
          ./build/hft_engine --events 1000 --journal out/ci.jrn > out/unclean.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 6
          grep -q "refusing to start" out/unclean.txt

          # --recover explains what is there without needing to start.
          ./build/hft_engine --recover out/ci.jrn | tee out/recover.txt
          grep -q "torn tail" out/recover.txt
          # And the explicit override lets an operator proceed.
          ./build/hft_engine --events 1000 --journal out/ci.jrn \
            --allow-unclean-start --set max_orders_per_second=100000000 > /dev/null

      - name: Reconciliation against the venue gates an unclean restart
        working-directory: cpp
        run: |
          mkdir -p out
          rm -f out/recon.jrn
          ./build/hft_engine --events 60000 --journal out/recon.jrn \
            --set max_orders_per_second=100000000 > /dev/null
          # Crash: lose the end-of-session marker and the last record.
          python3 -c "import os; p='out/recon.jrn'; os.truncate(p, os.path.getsize(p)-232)"

          # What did we leave behind? Build the venue's answer from it.
          ./build/hft_engine --recover out/recon.jrn > out/recon.txt
          python3 - <<'EOF'
          import re
          text = open('out/recon.txt').read()
          order = re.search(r"cl_ord_id=(\d+) symbol=(\d+) (BUY|SELL) (\d+) @ ([\d.]+)", text)
          pos = re.search(r"position symbol 0\s+: (-?\d+)", text)
          assert order, text
          cl, sym, side, qty, px = order.groups()
          px = int(round(float(px) * 100))
          with open('out/venue_ok.txt', 'w') as f:
              f.write("ORDER,%s,0,SYNTH,%s,%d,%s,0,%s\n" % (cl, side, px, qty, qty))
              f.write("POSITION,SYNTH,%s\n" % (pos.group(1) if pos else "0"))
          # The same file, plus an order the venue is resting that we never sent.
          with open('out/venue_orphan.txt', 'w') as f:
              f.write(open('out/venue_ok.txt').read())
              f.write("ORDER,999999,0,SYNTH,BUY,10000,50,0,50\n")
          EOF

          # An agreeing venue resolves the unclean shutdown: the engine starts,
          # and takes over the order that is still resting rather than leaving
          # it untracked.
          ./build/hft_engine --events 1000 --journal out/recon.jrn \
            --venue-state out/venue_ok.txt --out-dir out \
            --set max_orders_per_second=100000000 > out/recon_ok.txt 2>&1
          grep -q "reconciled clean against the venue" out/recon_ok.txt
          python3 -c "
          import json
          m = json.load(open('out/metrics.json'))
          assert m['orders']['adopted'] >= 1, m['orders']
          "

          # An order live at the venue and unknown to us is the one break that
          # must never be startable through.
          python3 -c "import os; p='out/recon.jrn'; os.truncate(p, os.path.getsize(p)-232)"
          set +e
          ./build/hft_engine --events 1000 --journal out/recon.jrn \
            --venue-state out/venue_orphan.txt > out/recon_bad.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 6
          grep -q "ORPHAN_AT_VENUE" out/recon_bad.txt

      - name: A gapped feed must stop trading
        working-directory: cpp
        run: |
          mkdir -p out
          ./build/hft_engine --write-replay out/gapped.csv --replay-events 40000
          # Delete a block of rows from the middle of the capture, leaving the
          # sequence numbers discontinuous.
          python3 - <<'EOF'
          rows = open('out/gapped.csv').read().splitlines()
          head, body = rows[0], rows[1:]
          body = body[:15000] + body[15500:]
          open('out/gapped.csv', 'w').write('\n'.join([head] + body) + '\n')
          EOF
          ./build/hft_engine --replay out/gapped.csv --out-dir out \
            --set max_orders_per_second=100000000 > out/gap.txt 2>&1
          grep -q "sequence gaps       : 1" out/gap.txt
          # A book built from an incomplete stream must not be traded on.
          grep -q "FAULTED" out/gap.txt
          python3 -c "
          import json,sys
          m = json.load(open('out/metrics.json'))
          assert m['feed']['faulted'] is True, m['feed']
          assert m['feed']['messages_missing'] == 500, m['feed']
          assert m['risk']['halted'] is True, m['risk']
          "

      - name: Deterministic replay must reproduce exactly
        working-directory: cpp
        run: |
          mkdir -p out
          ./build/hft_engine --write-replay out/replay.csv --replay-events 50000
          ./build/hft_engine --replay out/replay.csv --out-dir out \
            --set max_orders_per_second=100000000 > out/run1.txt
          ./build/hft_engine --replay out/replay.csv --out-dir out \
            --set max_orders_per_second=100000000 > out/run2.txt
          # Latency figures legitimately vary run to run; the trading result
          # must not.
          grep -E "realized pnl|orders sent|book trades" out/run1.txt > out/r1.txt
          grep -E "realized pnl|orders sent|book trades" out/run2.txt > out/r2.txt
          diff out/r1.txt out/r2.txt

  cpp-sanitizers:
    name: C++ sanitizers (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      # These need libasan/libubsan/libtsan, which the MSYS2/MinGW toolchain
      # does not ship -- so they run here rather than on Windows. `make
      # hardened` below is the MinGW-compatible equivalent.
      - name: Run test suite under ${{ matrix.san }}
        working-directory: cpp
        run: make ${{ matrix.san }}

  cpp-hardened:
    name: C++ hardened build (no sanitizer runtime required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # UBSan trap mode + _GLIBCXX_DEBUG + _GLIBCXX_ASSERTIONS + stack
      # protector. This is the configuration that also runs on MinGW.
      - name: Run test suite hardened
        working-directory: cpp
        run: make hardened

  cpp-benchmarks:
    name: C++ benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: cpp
        run: make -j"$(nproc)" build/hft_bench
      # CI runners are noisy shared VMs, so these numbers are NOT publishable
      # figures. This only proves the benchmarks still run and produce output.
      - name: Run
        working-directory: cpp
        run: |
          mkdir -p out
          ./build/hft_bench --out-dir out
          test -s out/bench_results.csv
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: cpp/out/bench_*.csv
