# Local monitoring stack for the HFT pipeline: Prometheus scrapes the Python
# engine's /metrics endpoint, Grafana renders it. Both are provisioned from
# files in this directory, so `docker compose up -d` gives a working dashboard
# with no clicking through setup wizards.
#
#   cd monitoring && docker compose up -d
#   python -m hft.main --metrics --symbols AAPL MSFT --poll-interval 2
#
#   Grafana:    http://localhost:3002  (admin / admin)
#   Prometheus: http://localhost:9091
#
# The pipeline itself runs on the host, not in Compose -- this stack only
# observes it.

# Explicit project name. Without it Compose derives the project from the
# directory name -- "monitoring" -- which is what every other project calls
# this folder too, so `docker compose up` here would adopt and recreate a
# neighbouring stack's containers and volumes.
name: hft-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: hft-prometheus
    restart: unless-stopped
    ports:
      # 9091 rather than Prometheus' default 9090, which is commonly already
      # bound by another local stack on a dev box.
      - '9091:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # Needed for the runtime-reload used when changing the scrape target's port.
      - '--web.enable-lifecycle'
    extra_hosts:
      # Lets the container reach the pipeline running on the host. Docker
      # Desktop provides host.docker.internal already; this keeps the same
      # config working on Linux.
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.5.1
    container_name: hft-grafana
    restart: unless-stopped
    ports:
      # 3002 rather than Grafana's default 3000, which collides with too many
      # dev servers (and 3001, which a neighbouring stack may already use).
      - '3002:3000'
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # This is a local observability sandbox, not an internet-facing Grafana.
      # Anonymous viewers keep screenshots and demos frictionless; do not carry
      # this to a real deployment.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_FEATURE_TOGGLES_ENABLE: ''
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
